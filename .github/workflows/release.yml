name: Entrega Continua
on:
  release:
    types: [published]
jobs:
  entrega:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v
      - uses: actions/upload-artifact@v4
        with:
          name: TaskManager-v1
          path: |
            app.py
            requirements.txt
            templates/
            static/
            README.md
